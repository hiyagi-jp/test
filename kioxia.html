<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キオクシア株価</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      background: #111;
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
    }

    #name {
      font-size: 5vw;
      color: #888;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    #price {
      font-size: 20vw;
      font-weight: 100;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    #change {
      font-size: 5vw;
      margin-top: 0.5rem;
      font-variant-numeric: tabular-nums;
    }

    #change.up   { color: #4caf50; }
    #change.down { color: #f44336; }

    #updated {
      font-size: 2.5vw;
      color: #555;
      margin-top: 2rem;
    }

    #error {
      font-size: 3vw;
      color: #f44336;
      text-align: center;
      padding: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div id="name">キオクシア (6600)</div>
  <div id="price">---</div>
  <div id="change">---</div>
  <div id="updated"></div>
  <div id="error"></div>

  <script>
    const priceEl   = document.getElementById('price');
    const changeEl  = document.getElementById('change');
    const updatedEl = document.getElementById('updated');
    const errorEl   = document.getElementById('error');

    function showTime() {
      const now = new Date();
      return `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }

    function render(price, prev) {
      const diff = price - prev;
      const pct  = (diff / prev) * 100;
      const sign = diff >= 0 ? '+' : '';
      priceEl.textContent  = `¥${price.toLocaleString()}`;
      changeEl.textContent = `${sign}${diff.toFixed(0)} (${sign}${pct.toFixed(2)}%)`;
      changeEl.className   = diff >= 0 ? 'up' : 'down';
      updatedEl.textContent = `更新: ${showTime()}`;
      errorEl.style.display = 'none';
    }

    /* --- データ取得戦略 --- */

    // 1. Stooq CSV（CORSフリーのデータソース）
    async function fetchStooq() {
      const url = 'https://stooq.com/q/l/?s=6600.jp&f=sd2t2ohlcv&h&e=csv';
      const res = await fetch(url);
      if (!res.ok) throw new Error('stooq ' + res.status);
      const text = await res.text();
      const rows = text.trim().split('\n');
      if (rows.length < 2) throw new Error('stooq empty');
      const cols = rows[1].split(',');
      // Symbol,Date,Time,Open,High,Low,Close,Volume
      const close = parseFloat(cols[6]);
      const open  = parseFloat(cols[3]);
      if (!close) throw new Error('stooq parse');
      render(close, open);
    }

    // 2. allorigins.win 経由で Yahoo Finance
    async function fetchViaAllOrigins() {
      const target = 'https://query2.finance.yahoo.com/v8/finance/chart/6600.T?interval=1d&range=1d';
      const proxy  = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target);
      const res = await fetch(proxy);
      if (!res.ok) throw new Error('allorigins ' + res.status);
      const json = await res.json();
      const meta = json.chart.result[0].meta;
      const price = meta.regularMarketPrice;
      const prev  = meta.previousClose ?? meta.chartPreviousClose;
      render(price, prev);
    }

    // 3. 直接 Yahoo Finance（CORS が通る環境向け）
    async function fetchDirect() {
      const url = 'https://query1.finance.yahoo.com/v8/finance/chart/6600.T?interval=1d&range=1d';
      const res = await fetch(url);
      if (!res.ok) throw new Error('direct ' + res.status);
      const json = await res.json();
      const meta = json.chart.result[0].meta;
      render(meta.regularMarketPrice, meta.previousClose ?? meta.chartPreviousClose);
    }

    async function fetchPrice() {
      const strategies = [fetchStooq, fetchViaAllOrigins, fetchDirect];
      for (const fn of strategies) {
        try {
          await fn();
          return;
        } catch (_) { /* 次の手段へ */ }
      }
      errorEl.textContent = `データ取得に失敗しました (${showTime()})`;
      errorEl.style.display = 'block';
    }

    fetchPrice();
    setInterval(fetchPrice, 30000);
  </script>
</body>
</html>
